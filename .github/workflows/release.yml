name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v* tag to release"
        required: true
        type: string

# Build code has read-only repository access. Publishing runs in a separate job.
permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    if: ${{ (github.event_name == 'push' && !github.event.deleted) || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag_sha: ${{ steps.verify_tag.outputs.tag_sha }}
    steps:
      - name: Checkout requested tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          # The build job has only contents: read, so its persisted credential
          # cannot publish even if tag-controlled build code accesses Git.
          persist-credentials: true

      - name: Verify release tag provenance
        id: verify_tag
        env:
          TAG: ${{ env.RELEASE_TAG }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          case "$TAG" in
            v[0-9]*) ;;
            *) echo "release tag must start with v and a version number" >&2; exit 1 ;;
          esac

          case "$TAG" in
            *[!A-Za-z0-9._-]*) echo "release tag contains unsupported characters" >&2; exit 1 ;;
          esac

          git fetch --no-tags origin \
            "refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          tag_sha=$(git rev-parse --verify "refs/tags/${TAG}^{commit}")
          checked_out_sha=$(git rev-parse --verify "HEAD^{commit}")
          if [ "$checked_out_sha" != "$tag_sha" ]; then
            echo "checked out commit does not match release tag" >&2
            exit 1
          fi
          default_sha=$(git rev-parse --verify "refs/remotes/origin/${DEFAULT_BRANCH}^{commit}")

          if ! git merge-base --is-ancestor "$tag_sha" "$default_sha"; then
            echo "release tag does not point to a commit contained in the default branch" >&2
            exit 1
          fi

          echo "tag_sha=$tag_sha" >> "$GITHUB_OUTPUT"

      - name: Setup mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          install: true

      - name: Install dependencies
        run: mix deps.get

      - name: Run tests
        run: mix test

      - name: Build release asset
        run: mise run release:build
        env:
          VERSION: ${{ env.RELEASE_TAG }}

      - name: Store release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Configure this environment with required reviewers in repository settings.
    environment:
      name: release
    steps:
      - name: Retrieve release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist

      - name: Upload release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ needs.build.outputs.tag_sha }}
          files: dist/*

      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail

          VERSION_NUM="${VERSION#v}"
          ASSET="git-work_${VERSION_NUM}.tar.gz"
          SHA256=$(cat "dist/${ASSET}.sha256")
          URL="https://github.com/beeemT/git-work/releases/download/${VERSION}/${ASSET}"

          cat > /tmp/git-work.rb <<FORMULA
          class GitWork < Formula
            desc "Branch-per-directory workflow wrapping git worktree"
            homepage "https://github.com/beeemT/git-work"
            url "${URL}"
            sha256 "${SHA256}"
            license "MIT"

            depends_on "erlang"

            def install
              bin.install "git-work"
            end

            test do
              assert_match "usage: git-work", shell_output("#{bin}/git-work --help 2>&1", 0)
            end
          end
          FORMULA

          ASKPASS=$(mktemp)
          trap 'rm -f "$ASKPASS"' EXIT
          cat > "$ASKPASS" <<'ASKPASS_SCRIPT'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' "x-access-token" ;;
            *Password*) printf '%s\n' "$TAP_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS_SCRIPT
          chmod 700 "$ASKPASS"

          GIT_ASKPASS="$ASKPASS" GIT_TERMINAL_PROMPT=0 \
            git clone "https://github.com/beeemT/tap.git" /tmp/tap
          mkdir -p /tmp/tap/Formula
          cp /tmp/git-work.rb /tmp/tap/Formula/git-work.rb

          cd /tmp/tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/git-work.rb
          git commit -m "git-work ${VERSION}"
          GIT_ASKPASS="$ASKPASS" GIT_TERMINAL_PROMPT=0 git push
